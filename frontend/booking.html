<header class="page-header">
  <div class="container">
    <h1>Reserve a Table</h1>
    <p>Fill in your details below. We'll email your confirmation once the team reviews your booking.</p>
  </div>
</header>

<section class="section">
  <div class="container" style="max-width:720px;">
    <div class="form-card">
      <div class="form-msg" id="formMsg"></div>
      <form id="bookingForm">
        <div class="form-row">
          <div class="field"><label for="name">Full Name *</label><input type="text" id="name" name="name" required placeholder="Your name"></div>
          <div class="field"><label for="phone">Phone Number *</label><input type="tel" id="phone" name="phone" required placeholder="10-digit mobile number" pattern="[0-9]{10}"></div>
        </div>

        <div class="field"><label for="email">Email (for booking confirmation)</label><input type="email" id="email" name="email" placeholder="you@example.com"></div>

        <div class="form-row">
          <div class="field"><label for="date">Date *</label><input type="date" id="date" name="date" required></div>
          <div class="field"><label for="time">Time *</label><input type="time" id="time" name="time" required></div>
        </div>

        <div class="form-row">
          <div class="field"><label for="guests">Number of Guests *</label><input type="number" id="guests" name="guests" min="1" max="100" required placeholder="e.g. 2"></div>
          <div class="field">
            <label for="occasion">Occasion</label>
            <select id="occasion" name="occasion">
              <option value="family">Casual / Everyday</option>
              <option value="party">Celebration</option>
              <option value="event">Event / Group</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="field"><label for="notes">Additional Notes (optional)</label><textarea id="notes" name="notes" placeholder="Any special requests..."></textarea></div>

        <div class="consent-field">
          <input type="checkbox" id="consent" name="consent" required>
          <label for="consent">I agree to Kamil Cafe processing my personal data to handle this booking, as described in the <a href="privacy.html" target="_blank">Privacy Policy</a>. *</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;" id="submitBtn">Request Booking</button>
      </form>
    </div>
  </div>
</section>
