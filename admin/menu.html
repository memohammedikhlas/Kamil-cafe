<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Management | Kamil Cafe Admin</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand"><img src="assets/logo.svg" alt="" width="30" height="30"><span class="brand-word"><span class="name">Kamil</span><span class="sub">CAFE ADMIN</span></span></div>
    <ul class="admin-nav">
      <li><a href="dashboard.html"><span class="icon">&#128202;</span> Overview</a></li>
      <li><a href="bookings.html"><span class="icon">&#128197;</span> Bookings</a></li>
      <li><a href="menu.html" class="active"><span class="icon">&#127869;&#65039;</span> Menu</a></li>
      <li><a href="offers.html"><span class="icon">&#127991;&#65039;</span> Offers</a></li>
      <li><a href="hero-slides.html"><span class="icon">&#128247;</span> Hero Images</a></li>
      <li><a href="gallery.html"><span class="icon">&#128444;&#65039;</span> Gallery</a></li>
      <li><a href="contacts.html"><span class="icon">&#9993;&#65039;</span> Contacts</a></li>
      <li><a href="settings.html"><span class="icon">⚙️</span> Settings</a></li>
    </ul>
    <button class="admin-logout" id="logoutBtn">Log Out</button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Menu Management</h1><p>Add, edit, or remove items. Changes reflect on the live menu page instantly.</p></div>
      <button class="btn btn-primary" id="addItemBtn">+ Add Item</button>
    </div>

    <div class="filters-bar">
      <input type="text" id="searchInput" placeholder="Search items...">
      <select id="categoryFilter"><option value="">All Categories</option></select>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Tag</th><th>Available</th><th>Actions</th></tr></thead>
        <tbody id="menuBody"><tr><td colspan="6" style="text-align:center; padding:30px;">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay" id="itemModal">
  <div class="modal-box">
    <h3 id="modalTitle">Add Item</h3>
    <div class="form-msg" id="modalMsg"></div>
    <form id="itemForm">
      <input type="hidden" id="itemId">
      <div class="field">
        <label for="itemName">Item Name *</label>
        <input type="text" id="itemName" required placeholder="e.g. Cappuccino">
      </div>
      <div class="form-row">
        <div class="field">
          <label for="itemCategory">Category *</label>
          <input type="text" id="itemCategory" required list="categoryOptions" placeholder="e.g. Coffee">
          <datalist id="categoryOptions"></datalist>
        </div>
        <div class="field">
          <label for="itemPrice">Price (&#8377;) *</label>
          <input type="number" id="itemPrice" min="0" required placeholder="e.g. 160">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="itemDiet">Diet Tag</label>
          <select id="itemDiet"><option value="veg">Veg</option><option value="jain">Jain</option></select>
        </div>
        <div class="field">
          <label for="itemAvailable">Availability</label>
          <select id="itemAvailable"><option value="true">Available</option><option value="false">Unavailable</option></select>
        </div>
      </div>
      <div class="modal-close-row">
        <button type="button" class="btn btn-outline" id="modalCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="modalSaveBtn">Save Item</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/menu-admin.js"></script>
</body>
</html>
