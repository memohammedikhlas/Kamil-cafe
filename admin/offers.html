<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offers | Kamil Cafe Admin</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand"><img src="assets/logo.svg" alt="" width="30" height="30"><span class="brand-word"><span class="name">Kamil</span><span class="sub">CAFE ADMIN</span></span></div>
    <ul class="admin-nav">
      <li><a href="dashboard.html"><span class="icon">&#128202;</span> Overview</a></li>
      <li><a href="bookings.html"><span class="icon">&#128197;</span> Bookings</a></li>
      <li><a href="menu.html"><span class="icon">&#127869;&#65039;</span> Menu</a></li>
      <li><a href="offers.html" class="active"><span class="icon">&#127991;&#65039;</span> Offers</a></li>
      <li><a href="hero-slides.html"><span class="icon">&#128247;</span> Hero Images</a></li>
      <li><a href="gallery.html"><span class="icon">&#128444;&#65039;</span> Gallery</a></li>
      <li><a href="contacts.html"><span class="icon">&#9993;&#65039;</span> Contacts</a></li>
      <li><a href="settings.html"><span class="icon">⚙️</span> Settings</a></li>
    </ul>
    <button class="admin-logout" id="logoutBtn">Log Out</button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Offers</h1><p>Shown in the "This week" section on the homepage — only while marked Active.</p></div>
      <button class="btn btn-primary" id="addOfferBtn">+ Add Offer</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Title</th><th>Badge</th><th>Valid Till</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="offersBody"><tr><td colspan="5" style="text-align:center; padding:30px;">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay" id="offerModal">
  <div class="modal-box">
    <h3 id="offerModalTitle">Add Offer</h3>
    <div class="form-msg" id="offerModalMsg"></div>
    <form id="offerForm">
      <input type="hidden" id="offerId">
      <div class="field"><label for="offerTitle">Title *</label><input type="text" id="offerTitle" required placeholder="e.g. Happy Hour, 4-6 PM"></div>
      <div class="field"><label for="offerDescription">Description</label><textarea id="offerDescription" placeholder="e.g. 20% off all cold brew and iced coffee"></textarea></div>
      <div class="form-row">
        <div class="field"><label for="offerBadge">Badge Text</label><input type="text" id="offerBadge" placeholder="e.g. 20% OFF"></div>
        <div class="field"><label for="offerValidTill">Valid Till</label><input type="text" id="offerValidTill" placeholder="e.g. 31 Aug or Every weekday"></div>
      </div>
      <div class="field">
        <label for="offerActive">Status</label>
        <select id="offerActive"><option value="true">Active (visible on website)</option><option value="false">Inactive (hidden)</option></select>
      </div>
      <div class="modal-close-row">
        <button type="button" class="btn btn-outline" id="offerModalCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="offerModalSaveBtn">Save Offer</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/offers-admin.js"></script>
</body>
</html>
