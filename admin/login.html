<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Kamil Cafe</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="admin-brand">
      <img src="assets/logo.svg" alt="" width="34" height="34">
      <span class="brand-word"><span class="name">Kamil</span><span class="sub">CAFE ADMIN</span></span>
    </div>
    <div class="form-msg" id="loginMsg"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" aria-pressed="false">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Log In</button>
    </form>
    <p style="text-align:center; margin-top:20px; font-size:0.85rem;"><a href="#" data-frontend-link="index.html" style="color:var(--taupe);">&larr; Back to website</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
