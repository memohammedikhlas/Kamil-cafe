<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings | Kamil Cafe Admin</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand"><img src="assets/logo.svg" alt="" width="30" height="30"><span class="brand-word"><span class="name">Kamil</span><span class="sub">CAFE ADMIN</span></span></div>
    <ul class="admin-nav">
      <li><a href="dashboard.html"><span class="icon">&#128202;</span> Overview</a></li>
      <li><a href="bookings.html" class="active"><span class="icon">&#128197;</span> Bookings</a></li>
      <li><a href="menu.html"><span class="icon">&#127869;&#65039;</span> Menu</a></li>
      <li><a href="offers.html"><span class="icon">&#127991;&#65039;</span> Offers</a></li>
      <li><a href="hero-slides.html"><span class="icon">&#128247;</span> Hero Images</a></li>
      <li><a href="gallery.html"><span class="icon">&#128444;&#65039;</span> Gallery</a></li>
      <li><a href="contacts.html"><span class="icon">&#9993;&#65039;</span> Contacts</a></li>
      <li><a href="settings.html"><span class="icon">⚙️</span> Settings</a></li>
    </ul>
    <button class="admin-logout" id="logoutBtn">Log Out</button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Bookings</h1><p>Confirming or cancelling a booking with an email on file sends an automatic email.</p></div>
    </div>

    <div class="filters-bar">
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <input type="date" id="dateFilter">
      <button class="btn btn-outline btn-sm" id="clearFilters">Clear Filters</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Name</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th><th>Occasion</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="bookingsBody"><tr><td colspan="8" style="text-align:center; padding:30px;">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/bookings.js"></script>
</body>
</html>
