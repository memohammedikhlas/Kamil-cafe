<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Images | Kamil Cafe Admin</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand"><img src="assets/logo.svg" alt="" width="30" height="30"><span class="brand-word"><span class="name">Kamil</span><span class="sub">CAFE ADMIN</span></span></div>
    <ul class="admin-nav">
      <li><a href="dashboard.html"><span class="icon">&#128202;</span> Overview</a></li>
      <li><a href="bookings.html"><span class="icon">&#128197;</span> Bookings</a></li>
      <li><a href="menu.html"><span class="icon">&#127869;&#65039;</span> Menu</a></li>
      <li><a href="offers.html"><span class="icon">&#127991;&#65039;</span> Offers</a></li>
      <li><a href="hero-slides.html" class="active"><span class="icon">&#128247;</span> Hero Images</a></li>
      <li><a href="gallery.html"><span class="icon">&#128444;&#65039;</span> Gallery</a></li>
      <li><a href="contacts.html"><span class="icon">&#9993;&#65039;</span> Contacts</a></li>
      <li><a href="settings.html"><span class="icon">⚙️</span> Settings</a></li>
    </ul>
    <button class="admin-logout" id="logoutBtn">Log Out</button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Hero Images</h1><p>The photo panel on the homepage. Upload one image, or a few to slowly crossfade between.</p></div>
    </div>

    <div class="form-card" style="margin-bottom:28px;">
      <div class="form-msg" id="uploadMsg"></div>
      <form id="uploadForm">
        <div class="form-row">
          <div class="field"><label for="heroFile">Photo *</label><input type="file" id="heroFile" accept="image/*" required></div>
          <div class="field"><label for="heroCaption">Internal Label (optional)</label><input type="text" id="heroCaption" placeholder="e.g. Window bar, evening"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="uploadBtn">Upload Photo</button>
      </form>
    </div>

    <div class="thumb-grid" id="heroGrid"></div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/hero-slides-admin.js"></script>
</body>
</html>
